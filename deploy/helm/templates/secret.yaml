{{- /*
CLOISON STACK-7 — templates/secret.yaml
Secret minimal contenant les deux secrets de la charte :
  tenant-key-hex : clé locataire 32 octets (64 hex) — partagée edge/control
  access-token   : jeton local mn_* attendu par edge
Si global.existingSecret est défini, AUCUN secret n'est créé (utiliser le
secret existant — recommandé en production, cf. docs/DEPLOY.md §Secrets).
*/ -}}

{{- if and (not .Values.global.existingSecret) (or .Values.global.tenantKeyHex .Values.global.accessToken) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: cloison
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.global.tenantKeyHex }}
  tenant-key-hex: {{ .Values.global.tenantKeyHex | quote }}
  {{- end }}
  {{- if .Values.global.accessToken }}
  access-token: {{ .Values.global.accessToken | quote }}
  {{- end }}
{{- end }}
