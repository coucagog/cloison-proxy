server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le ledger + la clé publique du contrôle : volume partagé (lecture seule).
    location = /ledger.jsonl {
        alias /srv/journal/ledger.jsonl;
        default_type application/json;
    }
    location = /control_pubkey.hex {
        alias /srv/journal/control_pubkey.hex;
        default_type text/plain;
    }

    location /verify/ {
        # Glue WASM (wasm-bindgen) : MIME correct pour le .wasm.
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    # Jamais de listing, jamais d'exécution côté serveur.
    location / { try_files $uri $uri/ =404; }
}
