# =============================================================================
# CLOISON STACK-7 — docker-compose de développement (hôte cible : wonkom.ai).
#
# Usage :
#   cp deploy/.env.example .env && $EDITOR .env      # secrets uniquement ici
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#   curl http://127.0.0.1:8787/v1/models \
#     -H "Authorization: Bearer mn_${CLOISON_EXPECTED_ACCESS_TOKEN}.${OPENROUTER_API_KEY}"
#   docker compose -f deploy/docker-compose.dev.yml down -v
#
# Règles :
#   - AUCUN secret en dur : tout passe par l'environnement (fichier .env ou
#     variables exportées — l'env du shell prime sur le fichier .env).
#   - réseau `cloison-net` (bord) : seul edge y est attaché — il publie 8787
#     sur l'hôte. PAS `internal: true` ici : docker ne publie AUCUN port sur
#     un réseau interne (moby/moby#53256 — la publication percerait
#     l'isolation), edge serait injoignable. La frontière « non exposé »
#     (THREAT-MODEL §3.1) est assurée par l'absence de ports publiés pour
#     control/detect/postgres, placés sur `cloison-internal` (internal: true,
#     aucun egress) — leurs lignes `ports:` sont commentées par défaut ;
#     les décommenter uniquement pour du debug local.
#   - `read_only: true` + `tmpfs: [/tmp]` + `cap_drop: [ALL]` +
#     `security_opt: [no-new-privileges:true]` partout (invariant opérationnel O3).
#   - healthcheck réel uniquement sur `detect` (python présent dans l'image) ;
#     les images Rust distroless n'ont ni shell ni curl : leur liveness passe
#     par les sondes K8s httpGet (docs/DEPLOY.md §Healthchecks).
#
# ÉTAT STACK-8 + DEPLOY-5 :
#   - `edge` + `control` + `detect` construits et fonctionnels (binaire control
#     committé, PostgresStore feature `pg` dans l'image control).
#   - `detect` : image COMPLÈTE par défaut (GLiNER + afroxlmr, cf. verdict GO) ;
#     `CLOISON_LITE=1` pour l'image légère.
#   - `postgres` (profil `db`) : persistance du plan de contrôle ; activer avec
#     `docker compose --profile db up -d --build` + `CLOISON_DATABASE_URL`.
#   - Wiring B.1 (`CLOISON_DETECT_URL`) : LU par le binaire (edge → sidecar NER).
#   - Wiring C (`CLOISON_CONTROL_URL`) : LU par le binaire (auth par hash,
#     long-poll des versions, ingest automatique des reçus d'audit) — vide par
#     défaut (mode N0) ; activer après provisionnement (deploy/provision_control.sh).
#   - `CLOISON_ROLE` : LU au boot (DEPLOY-10) — chaque binaire vérifie son rôle
#     (edge → cloison-proxy, control → cloison-control) et échoue bruyamment
#     en cas de valeur incompatible. Deux binaires distincts (le contrôle
#     exige la feature `pg` que l'edge ne doit pas embarquer) — l'image par
#     service reste le mécanisme de dispatch.
# =============================================================================

name: cloison-dev

services:
  # ---------------------------------------------------------------------------
  # Edge : passerelle OpenAI-compatible (binaire cloison-proxy).
  # Port publié : 8787 (seul service exposé hors du réseau interne).
  # ---------------------------------------------------------------------------
  edge:
    # ⚠️ L'image GHCR n'est PAS publiée (`docker pull` → unauthorized, constat
    # sonde 02-03/09/2026) : construire en local (build: ci-dessous) ou utiliser
    # la release publique (deploy/install-n0.sh). Le `image:` ne sert qu'au nom
    # local après build.
    image: ghcr.io/coucagog/cloison-proxy:edge
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    environment:
      # Rôle cible STACK-7 (dispatch config.rs) ; défaut edge, ignoré
      # par le binaire actuel.
      CLOISON_ROLE: edge
      CLOISON_LISTEN_ADDR: 0.0.0.0:8787
      # Amont réel : OpenRouter. Chemins compatibles : base /api/v1 + chemins
      # /chat/completions, /models (OpenRouter) OU base /api + chemins
      # /v1/chat/completions, /v1/models (style OpenAI) OU DeepSeek :
      # base https://api.deepseek.com + /chat/completions (voir docs/CONFIG.md).
      CLOISON_UPSTREAM_BASE_URL: ${CLOISON_UPSTREAM_BASE_URL:-https://openrouter.ai/api/v1}
      CLOISON_UPSTREAM_CHAT_PATH: ${CLOISON_UPSTREAM_CHAT_PATH:-/chat/completions}
      CLOISON_UPSTREAM_COMPLETIONS_PATH: ${CLOISON_UPSTREAM_COMPLETIONS_PATH:-/v1/completions}
      CLOISON_UPSTREAM_MODELS_PATH: ${CLOISON_UPSTREAM_MODELS_PATH:-/models}
      CLOISON_UPSTREAM_CONNECT_TIMEOUT_MS: ${CLOISON_UPSTREAM_CONNECT_TIMEOUT_MS:-5000}
      CLOISON_UPSTREAM_TIMEOUT_MS: ${CLOISON_UPSTREAM_TIMEOUT_MS:-30000}
      CLOISON_MAX_BODY_BYTES: ${CLOISON_MAX_BODY_BYTES:-1048576}
      CLOISON_STREAM_MAX_TOKEN_LEN: ${CLOISON_STREAM_MAX_TOKEN_LEN:-64}
      CLOISON_STREAM_NEUTRAL_MARKER: ${CLOISON_STREAM_NEUTRAL_MARKER:-[REDACTED]}
      CLOISON_STREAM_KEEP_ALIVE_MS: ${CLOISON_STREAM_KEEP_ALIVE_MS:-15000}
      # Secrets (jamais en dur) : jeton local mn_* attendu + clé locataire.
      CLOISON_EXPECTED_ACCESS_TOKEN: ${CLOISON_EXPECTED_ACCESS_TOKEN:?défini dans .env}
      CLOISON_TENANT_KEY_HEX: ${CLOISON_TENANT_KEY_HEX:?défini dans .env}
      CLOISON_SESSION_SALT_HEX: ${CLOISON_SESSION_SALT_HEX:-}
      CLOISON_MOCK_MODE: ${CLOISON_MOCK_MODE:-0}
      # Mode audit observe-only (STACK-4) : reçus signés Ed25519 + rapport k-anonyme.
      # 0 = masquage/restauration actif (nécessaire pour l'e2e réel).
      CLOISON_AUDIT_MODE: ${CLOISON_AUDIT_MODE:-1}
      CLOISON_AUDIT_KEYS: ${CLOISON_AUDIT_KEYS:-/data/audit_key}
      CLOISON_AUDIT_K: ${CLOISON_AUDIT_K:-5}
      # Persistance des reçus d'audit (STACK-8) : JSONL append-only 0600,
      # rechargé au boot — les reçus survivent aux redémarrages.
      CLOISON_AUDIT_LEDGER_FILE: ${CLOISON_AUDIT_LEDGER_FILE:-/data/audit_ledger.jsonl}
      # Wiring edge -> detect (B.1) : le proxy consomme le sidecar NER via
      # REST (POST /detect). Dégradation gracieuse si detect est indisponible
      # (détection embarquée seule — jamais d'erreur).
      CLOISON_DETECT_URL: ${CLOISON_DETECT_URL:-http://detect:8080/detect}
      CLOISON_DETECT_TIMEOUT_MS: ${CLOISON_DETECT_TIMEOUT_MS:-2000}
      # Wiring edge -> contrôle (C) : auth par hash (POST /v1/control/verify),
      # long-poll des versions (rotation des jetons) et ingest automatique des
      # reçus d'audit (POST /v1/control/ingest — transparence). VIDE = N0
      # (auth locale statique, pas d'ingest). Provisionner le tenant + le hash
      # du jeton dans le contrôle AVANT d'activer (deploy/provision_control.sh).
      CLOISON_TENANT_ID: ${CLOISON_TENANT_ID:-default}
      CLOISON_CONTROL_URL: ${CLOISON_CONTROL_URL:-}
      CLOISON_CONTROL_INGEST_INTERVAL_SECS: ${CLOISON_CONTROL_INGEST_INTERVAL_SECS:-60}
      CLOISON_CONTROL_POLL_INTERVAL_SECS: ${CLOISON_CONTROL_POLL_INTERVAL_SECS:-30}
      CLOISON_CONTROL_VERIFY_CACHE_TTL_SECS: ${CLOISON_CONTROL_VERIFY_CACHE_TTL_SECS:-300}
      RUST_LOG: ${RUST_LOG:-cloison_proxy=info}
    ports:
      - "8787:8787"          # publié sur wonkom.ai (dev)
    volumes:
      - edge-data:/data      # clés d'audit, registres
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cloison-net
      # B.1 : edge rejoint le réseau interne pour atteindre detect (aucun port
      # publié n'en sort — la frontière THREAT-MODEL §3.1 est conservée).
      - cloison-internal

  # ---------------------------------------------------------------------------
  # Control : plan de contrôle aveugle (binaire cloison-control, PRÉREQUIS).
  # Registre : journal append-only cloison-ledger persisté dans CLOISON_LEDGER_FILE
  # (/data/ledger.jsonl). Port 8788 NON publié hors dev.
  # ---------------------------------------------------------------------------
  control:
    image: ghcr.io/coucagog/cloison-control:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control
    environment:
      CLOISON_ROLE: control
      # Le binaire lit CLOISON_CONTROL_PORT (défaut 8788) — pas CLOISON_LISTEN_ADDR.
      CLOISON_CONTROL_PORT: 8788
      # Journal de transparence (append-only, chaîne de hachage + signatures
      # Ed25519) — persistance implémentée par le binaire STACK-7.
      CLOISON_LEDGER_FILE: ${CLOISON_LEDGER_FILE:-/data/ledger.jsonl}
      CLOISON_TENANT_KEY_HEX: ${CLOISON_TENANT_KEY_HEX:?défini dans .env}
      # Clé de signature Ed25519 du contrôle (64 hex) : STABLE en production —
      # le ledger doit rester vérifiable entre redémarrages (surface publique
      # journal.wonkom.ai, étape C). Absente → clé éphémère (dev).
      CLOISON_CONTROL_SIGNING_KEY: ${CLOISON_CONTROL_SIGNING_KEY:-}
      # Clé publique Ed25519 de l'agent au bord (64 hex) : vérifie sig_agent
      # des reçus à l'ingest (POST /v1/control/ingest). Absente → éphémère.
      CLOISON_AGENT_VERIFY_KEY: ${CLOISON_AGENT_VERIFY_KEY:-}
      # PostgresStore (STACK-8, feature `pg` — image construite avec) :
      # activer avec le profil `db` et CLOISON_DATABASE_URL. Absent →
      # InMemoryStore (perte au restart, dev).
      CLOISON_DATABASE_URL: ${CLOISON_DATABASE_URL:-}
      # Logs du control (crate cloison_control) — le filtre par défaut du
      # compose couvrait uniquement cloison_proxy (logs control invisibles).
      RUST_LOG: ${RUST_LOG:-cloison_control=info}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Port 8788 NON publié (réseau interne) : l'API admin ne sort pas du
    # réseau interne (THREAT-MODEL §3.1). Décommenter pour du debug local :
    # ports:
    #   - "8788:8788"
    volumes:
      - control-data:/data   # volume du ledger (sauvegarder : docs/DEPLOY.md)
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cloison-internal

  # ---------------------------------------------------------------------------
  # Detect : sidecar NER stateless (Python). REST 8080 (repli + debug) et
  # gRPC 50051 (nominal). Healthcheck réel (python dans l'image).
  # ---------------------------------------------------------------------------
  detect:
    image: ghcr.io/coucagog/cloison-detect:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.detect
      args:
        # Défaut STACK-8 : image COMPLÈTE (GLiNER + torch/transformers) —
        # le fossé GO (grille v1.1) repose sur afroxlmr/GLiNER ; passer
        # CLOISON_LITE=1 pour une image légère sans NER transformer.
        CLOISON_LITE: ${CLOISON_LITE:-0}
        SPACY_MODEL: ${SPACY_MODEL:-fr_core_news_md}
    environment:
      CLOISON_TRANSPORT: ${CLOISON_TRANSPORT:-both}
      CLOISON_REST_PORT: ${CLOISON_REST_PORT:-8080}
      CLOISON_GRPC_PORT: ${CLOISON_GRPC_PORT:-50051}
      CLOISON_OFFLINE: ${CLOISON_OFFLINE:-0}
      # Préchargement des modèles au boot (défaut STACK-8, effectif depuis
      # B.2) : presidio + GLiNER + NER africain (afroxlmr par défaut produit)
      # — pas de latence au premier appel ; dégradation gracieuse si un modèle
      # manque. Le premier boot télécharge les modèles (volume /models) : le
      # start_period du healthcheck couvre ce chargement (B.2).
      CLOISON_PRELOAD: ${CLOISON_PRELOAD:-all}
      CLOISON_SPACY_SIZE: ${CLOISON_SPACY_SIZE:-md}
      CLOISON_MODEL_DIR: /models
      # Cache Hugging Face dans le volume /models (GLiNER, afroxlmr…).
      HF_HOME: /models
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      CLOISON_MODEL_CACHE_GB: ${CLOISON_MODEL_CACHE_GB:-6}
      CLOISON_BUDGET_SECONDS: ${CLOISON_BUDGET_SECONDS:-2.0}
      CLOISON_QUARANTINE_SECONDS: ${CLOISON_QUARANTINE_SECONDS:-300}
      CLOISON_SESSION_MENTIONS_MAX: ${CLOISON_SESSION_MENTIONS_MAX:-200}
      CLOISON_ONNX: ${CLOISON_ONNX:-0}
      CLOISON_ONNX_INT8: ${CLOISON_ONNX_INT8:-1}
      CLOISON_DETECT_CONCURRENCY: ${CLOISON_DETECT_CONCURRENCY:-0}
      CLOISON_LOG_LEVEL: ${CLOISON_LOG_LEVEL:-INFO}
    # Ports NON publiés (réseau interne) : detect n'est consommé que par
    # edge (wiring STACK-7). Décommenter pour du debug local :
    # ports:
    #   - "8080:8080"          # REST /detect — repli, utile pour le debug
    #   - "50051:50051"        # gRPC nominal — retirer hors dev
    volumes:
      - detect-models:/models
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      # B.2 : le préchargement (téléchargements HF + chargement torch/GLiNER/
      # afroxlmr) retarde la mise en service — la sonde couvre ce délai.
      start_period: 600s
      retries: 3
    networks:
      - cloison-internal

  # ---------------------------------------------------------------------------
  # Journal public (étape C, DEPLOY-2) : surface lecture-seule de transparence
  # (journal.wonkom.ai). Sert le ledger + la clé publique du contrôle + une
  # page de vérification WASM (cloison-verify). Port publié UNIQUEMENT sur
  # 127.0.0.1 : joignable par Caddy seul, jamais directement par le public.
  # Le volume control-data est monté en LECTURE SEULE (aucune écriture).
  # ---------------------------------------------------------------------------
  journal:
    image: ghcr.io/coucagog/cloison-journal:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.journal
    volumes:
      - control-data:/srv/journal:ro
    ports:
      - "127.0.0.1:8789:80"
    tmpfs:
      - /tmp
      # nginx (alpine) exige des répertoires inscriptibles pour ses
      # temp/cache/pid ; le conteneur tourne en uid 101 → tmpfs chownés
      # (constat DEPLOY-2/C : read_only + tmpfs root → Permission denied).
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cloison-net

  # ---------------------------------------------------------------------------
  # Postgres (profil `db`, STACK-8) : persistance du plan de contrôle via
  # PostgresStore (feature `pg` — l'image control est construite avec).
  # Le registre nominal reste le journal CLOISON_LEDGER_FILE embarqué ;
  # postgres porte tenants/jetons hachés/politiques/licences. Activer avec :
  #   docker compose --profile db up -d --build
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: cloison
      POSTGRES_PASSWORD: ${CLOISON_PG_PASSWORD:-cloison-dev-only}
      POSTGRES_DB: cloison
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloison"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cloison-internal

volumes:
  edge-data:
  control-data:      # ledger (CLOISON_LEDGER_FILE) — sauvegarde critique
  detect-models:
  pg-data:

networks:
  # Réseau « bord » : edge (port 8787 publié sur l'hôte). Non-internal (voir
  # l'en-tête) ; edge rejoindra cloison-internal au STACK-7 wiring edge→detect.
  cloison-net:
  # Réseau interne strict : detect, control, postgres — aucun port publié,
  # aucun egress (internal: true). La frontière de confiance §3.1 THREAT-MODEL.
  cloison-internal:
    internal: true
