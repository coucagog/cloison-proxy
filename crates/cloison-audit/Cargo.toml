[package]
name = "cloison-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license.workspace = true
description = "CLOISON STACK-4 : Mode Audit observe-only — reçus signés Ed25519, seuils k-anonymes, rapport de conformité"
repository = "https://github.com/coucagog/cloison"
keywords = ["pii", "audit", "compliance", "k-anonymity", "ed25519"]
categories = ["cryptography", "privacy"]

[dependencies]
# Signature Ed25519 de l'agent au bord (RFC 8032, déterministe).
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Sérialisation : le message signé est le JSON canonique (compact, clés triées).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# policy_hash = hex(SHA-256(json canonique de la Policy)).
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
# Génération de clé aléatoire (AgentKeys) et de sel.
rand = "0.8"
# Détection PII réutilisée par le moteur d'audit (STACK-2).
cloison-core = { path = "../cloison-core" }

[dev-dependencies]
tempfile = "3"
