[package]
name = "cloison-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Plan de controle aveugle CLOISON : locataires, licences, politiques et jetons mn_ — le clair n'existe que dans la reponse d'emission, le stockage ne contient QUE le hash. API admin REST (axum) + pipeline ingest vers le journal (cloison-ledger) avec contresignature des recus d'audit (cloison-audit)."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
thiserror.workspace = true
rand.workspace = true
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pipeline control → journal (STACK-5 §5) : le control agrège/redacte les reçus
# (cloison-audit) et append les entrées contresignées dans le ledger (cloison-ledger).
cloison-ledger = { path = "../cloison-ledger" }
cloison-audit = { path = "../cloison-audit" }

[dev-dependencies]
tempfile = "3"
