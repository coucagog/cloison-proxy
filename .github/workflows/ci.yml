# =============================================================================
# CLOISON STACK-7 — CI complète.
#
# Jobs :
#   fmt          cargo fmt --check (rustfmt épinglé 1.97 — version de
#                normalisation du dépôt, voir DEPLOY-4)
#   clippy       cargo clippy --workspace --all-targets -- -D warnings
#   test-rust    cargo test --workspace + cargo check feature `pg` du contrôle
#   test-detect  pytest du sidecar Python (hors-ligne, CLOISON_OFFLINE=1)
#   bench        benchmark STACK-1 (seed 42, grille de scoring GO/NO-GO)
#   images       build des 4 images (proxy edge, control, detect, journal) +
#                SBOM (syft, SPDX) + scan bloquant trivy (échec HIGH/CRITICAL
#                corrigeable, images first-party proxy/control) + scan
#                advisory grype (toutes images) + push GHCR + cosign (OIDC)
#   e2e-llm      e2e contre un LLM réel (OpenRouter) — secrets d'environnement
#
# Politique de scan (invariant opérationnel O5, décision journalisée
# DEPLOY-5) : toute vulnérabilité HIGH/CRITICAL AVEC correctif disponible
# bloque la CI sur les images first-party (proxy/control — 0 CVE aujourd'hui) ;
# les écosystèmes tiers (detect : torch épinglé au verdict GO ; journal :
# nginx alpine, apk upgrade au build) sont scannés en advisory (rapports +
# SBOM), les CVE sans fix en amont sont tracées, pas bloquantes.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always
  GHCR: ghcr.io/coucagog

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt épinglé sur la version de normalisation du dépôt (1.97) : le
      # formateur stable courant peut diverger et casser le job sur des
      # fichiers NON touchés (dérive constatée DEPLOY-4 — dtolnay avec version).
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain épinglée 1.97 (comme fmt) : le clippy stable courant introduit
      # des lints absents de la toolchain de validation (ex. chunks_exact_to_as_chunks
      # en 1.98) — la CI doit être déterministe par rapport au dépôt.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # PostgresStore (feature `pg`) doit compiler en CI (dette STACK-8 :
      # « compile toujours sans la feature » — désormais vérifié AUSSI avec).
      # Les tests d'intégration réels restent `#[ignore]` (base requise).
      - name: Vérifier la feature pg du contrôle (compile)
        run: cargo check -p cloison-control --features pg --locked

  # ---------------------------------------------------------------------------
  test-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cloison-detect/requirements.txt
      - run: pip install -r services/cloison-detect/requirements.txt
        env:
          # torch==2.5.1+cpu n'existe que sur l'index CPU PyTorch (pas PyPI) —
          # même index que le Dockerfile detect (dette DEPLOY-2 : pin + CPU-only).
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      - name: Modèle spaCy (une fois)
        run: python -m spacy download fr_core_news_sm
      - name: Tests hors-ligne (stubs, aucun téléchargement, aucune PII réelle)
        run: pytest services/cloison-detect/tests -q
        env:
          CLOISON_OFFLINE: "1"

  # ---------------------------------------------------------------------------
  bench:
    runs-on: ubuntu-latest
    needs: [test-rust, test-detect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bench/cloison-bench/requirements.txt
      - name: Benchmark STACK-1 (seed 42)
        run: python bench/cloison-bench/run_benchmark.py --seed 42 --output bench/cloison-bench/results
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/cloison-bench/results
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  images:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-rust, test-detect]
    permissions:
      contents: read
      packages: write
      id-token: write            # OIDC → cosign (sans secret)
    strategy:
      fail-fast: false
      matrix:
        # journal inclus (DEPLOY-3/C) : l'image sert la surface publique du
        # ledger (nginx + WASM cloison-verify) — doit être poussée au GHCR
        # comme les trois autres (dette REPRISE-DEPLOIEMENT §5.3).
        # `blocking` (décision DEPLOY-5, déviation O5 journalisée) : la porte
        # de scan bloquante (trivy, fixes disponibles uniquement) s'applique
        # aux images FIRST-PARTY distroless (proxy, control — 0 CVE avec
        # fixes aujourd'hui). detect/journal embarquent des écosystèmes tiers
        # (torch épinglé au verdict GO, nginx alpine) dont les CVE ne sont pas
        # actionnables sans casser la stack validée → scans ADVISORY (rapports,
        # ne bloquent pas), SBOM toujours généré.
        include:
          - target: proxy
            blocking: "1"
          - target: control
            blocking: "1"
          - target: detect
            blocking: "0"
          - target: journal
            blocking: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR (push uniquement)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (main/tags) ou load (PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ${{ env.GHCR }}/cloison-${{ matrix.target }}:latest
            ${{ env.GHCR }}/cloison-${{ matrix.target }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/cloison-{1}:edge', env.GHCR, matrix.target) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR }}/cloison-${{ matrix.target }}:${{ github.sha }}
          format: spdx-json

      # Porte bloquante : trivy HIGH/CRITICAL AVEC fix disponible, images
      # first-party uniquement (matrix.blocking=1). `ignore-unfixed` : une
      # CVE sans correctif en amont est tracée, pas bloquante (constat
      # DEPLOY-5 : openssl/libc 2026 sans fix dans la base distroless).
      - name: Scan bloquant (trivy) — échec si HIGH/CRITICAL corrigeable
        if: matrix.blocking == '1'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR }}/cloison-${{ matrix.target }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif

      # Advisory (toutes images, y compris detect/journal) : rapport sans
      # blocage — les CVE des écosystèmes tiers sont tracées (logs + SBOM).
      - name: Scan advisory (grype) — rapport
        continue-on-error: true
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.GHCR }}/cloison-${{ matrix.target }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high

      - name: Installer cosign (OIDC)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Signer (cosign, OIDC)
        if: github.event_name == 'push'
        run: |
          cosign sign --yes \
            "${{ env.GHCR }}/cloison-${{ matrix.target }}@${{ steps.build.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # E2E — preuve de bout en bout (docs/DEPLOY.md §E2E).
  # CLOISON_E2E_MODE=both : d'abord le faux LLM local (mock_llm.py, assertion
  # du masquage amont — le corps reçu contient des sentinelles et pas la PII),
  # puis le LLM réel (OpenRouter, restauration réelle).
  # Secrets d'environnement GitHub : CLOISON_ACCESS_TOKEN, OPENROUTER_API_KEY.
  e2e-llm:
    runs-on: ubuntu-latest
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: e2e
    steps:
      - uses: actions/checkout@v4
      - name: E2E (mock local + LLM réel)
        run: deploy/e2e_reel.sh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOISON_ACCESS_TOKEN: ${{ secrets.CLOISON_ACCESS_TOKEN }}
          CLOISON_TENANT_KEY_HEX: ${{ secrets.CLOISON_TENANT_KEY_HEX }}
          CLOISON_UPSTREAM_BASE_URL: https://openrouter.ai/api/v1
          CLOISON_E2E_MODE: both
