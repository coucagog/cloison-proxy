<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" role="img" aria-label="CLOISON — coffre chiffré (vault, AES-256-GCM, clé dérivée)">
  <defs>
    <linearGradient id="vb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191C27"/>
      <stop offset="1" stop-color="#0E1119"/>
    </linearGradient>
    <linearGradient id="vbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3141"/>
      <stop offset="1" stop-color="#191F2C"/>
    </linearGradient>
    <linearGradient id="vsig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B7A85"/>
      <stop offset="1" stop-color="#37B5C0"/>
    </linearGradient>
    <filter id="vsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0E1119" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- fond sombre (le coffre = lieu de secret) -->
  <rect width="340" height="300" rx="24" fill="url(#vb)"/>
  <g stroke="#2A3141" stroke-width="1" opacity="0.6">
    <path d="M0 100 H340"/><path d="M0 200 H340"/>
    <path d="M113 0 V300"/><path d="M226 0 V300"/>
  </g>

  <!-- corps du coffre -->
  <g transform="translate(78,90)" filter="url(#vsoft)">
    <rect x="0" y="34" width="184" height="150" rx="18" fill="url(#vbody)" stroke="#3A4256" stroke-width="2"/>
    <!-- poignée / cadenas -->
    <path d="M92 34 C92 8 92 8 128 8 C164 8 164 34 164 34" fill="none" stroke="#37B5C0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="92" cy="92" r="20" fill="none" stroke="#37B5C0" stroke-width="4" opacity="0.7"/>
    <path d="M92 92 L92 74 L100 74" fill="none" stroke="#37B5C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- grille de jetons ⟦⟧ -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#7FD8DE" opacity="0.9">
      <text x="30" y="118">⟦ Amin ⟧</text>
      <text x="40" y="146">⟦ 77… ⟧</text>
      <text x="34" y="174">⟦ mail ⟧</text>
    </g>
    <!-- halo de chiffrement -->
    <circle cx="0" cy="150" r="6" fill="#37B5C0" opacity="0.0"/>
  </g>

  <!-- clé dérivée (en bas) -->
  <g transform="translate(44,258)">
    <path d="M0 12 H32" stroke="#E2A24C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="38" cy="12" r="7" fill="none" stroke="#E2A24C" stroke-width="4"/>
    <text x="56" y="17" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#E2A24C">clé dérivée HKDF · A·256·GCM</text>
  </g>

  <!-- badge fail-loud -->
  <rect x="150" y="236" width="146" height="24" rx="12" fill="#F6E4E2" opacity="0.92"/>
  <text x="164" y="252" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="#6f2b2b">fail-loud · jamais de clé en clair</text>
</svg>
