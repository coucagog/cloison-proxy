<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="CLOISON — journal de transparence vérifiable (chaîne de blocs Ed25519)">
  <defs>
    <linearGradient id="jb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7E9EE"/>
      <stop offset="1" stop-color="#DEE1E8"/>
    </linearGradient>
    <linearGradient id="jblock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6F9"/>
    </linearGradient>
    <linearGradient id="jverif" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E7A4D"/>
      <stop offset="1" stop-color="#0B7A85"/>
    </linearGradient>
    <filter id="jsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#191C27" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="360" height="300" rx="24" fill="url(#jb)"/>
  <g stroke="#CFD3DC" stroke-width="1" opacity="0.5">
    <path d="M0 100 H360"/><path d="M0 200 H360"/>
  </g>

  <!-- chaîne : 3 blocs liés -->
  <g transform="translate(30,150)" filter="url(#jsoft)">
    <!-- bloc 1 -->
    <g transform="translate(0,0)">
      <rect width="120" height="60" rx="10" fill="url(#jblock)" stroke="#CFD3DC"/>
      <text x="14" y="22" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8A8F9E">seq 1</text>
      <text x="14" y="44" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#191C27">a1b2c3d4…</text>
    </g>
    <!-- lien -->
    <path d="M128 30 H146" stroke="#0B7A85" stroke-width="3" stroke-linecap="round"/>
    <!-- bloc 2 (courant, plus clair) -->
    <g transform="translate(156,0)">
      <rect width="120" height="60" rx="10" fill="url(#jblock)" stroke="#0B7A85" stroke-width="2"/>
      <text x="14" y="22" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#0B7A85">seq 2</text>
      <text x="14" y="44" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#191C27">e5f6a7b8…</text>
    </g>
    <!-- lien -->
    <path d="M284 30 H302" stroke="#0B7A85" stroke-width="3" stroke-linecap="round"/>
    <!-- bloc 3 (hachuré pour le suivant) -->
    <g transform="translate(312,0)" opacity="0.45">
      <rect width="52" height="60" rx="10" fill="url(#jblock)" stroke="#CFD3DC" stroke-dasharray="4 4"/>
      <text x="14" y="22" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8A8F9E">…</text>
    </g>
  </g>

  <!-- vérification WASM (badge vert) -->
  <g transform="translate(52,52)">
    <rect width="256" height="46" rx="23" fill="url(#jverif)"/>
    <circle cx="26" cy="23" r="7" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M22 23 L25 26 L31 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="21" font-family="system-ui,sans-serif" font-weight="700" font-size="13" fill="#fff">Chaîne vérifiée</text>
    <text x="46" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#E3F1E9">dans votre navigateur · WASM</text>
  </g>

  <!-- compteurs k-anonymes -->
  <g transform="translate(52,244)">
    <text x="0" y="12" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#535868">CniSn 242 · Email 443 · Phone 531</text>
    <text x="0" y="30" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#8A8F9E">aucun texte · aucune PII · Ed25519</text>
  </g>
</svg>
