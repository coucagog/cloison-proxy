[package]
name = "cloison-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
# Décision open-core (charte §5.1, journal DEPLOY-5) : la passerelle serveur
# est en AGPL-3.0 (anti-forks hébergés fermés) ; les composants vérifiables
# (core/ledger/verify/audit/control/cli/wasm) restent Apache-2.0 (workspace).
license = "AGPL-3.0"
repository = "https://github.com/coucagog/cloison-proxy"
description = "CLOISON STACK-3 : passerelle OpenAI-compatible avec tokenisation PII"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
async-stream = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
url = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# Wiring C — hash des jetons `mn_` (même domaine que le contrôle : le clair ne
# quitte jamais le bord, seul le digest SHA-256 circule).
sha2 = "0.10"
cloison-core = { git = "https://github.com/coucagog/cloison-core", tag = "v0.1.0" }
cloison-audit = { git = "https://github.com/coucagog/cloison-audit", tag = "v0.1.0" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
