[workspace]
resolver = "2"
members = [
    "crates/cloison-core",
    "crates/cloison-proxy",
    "crates/cloison-audit",
    "crates/cloison-control",
    "crates/cloison-ledger",
    "crates/cloison-verify",
    "crates/cloison-cli",
    "crates/cloison-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/coucagog/cloison"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
redb = "2"
rand = "0.8"
thiserror = "1"
proptest = "1"
insta = "1"

# Release : binaire edge allégé et plus rapide (dette STACK-7).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
